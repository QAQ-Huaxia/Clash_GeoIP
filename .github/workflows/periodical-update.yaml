name: Update China IP list and generate GeoIP2 database

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  build:
    name: Generate GeoIP2 database
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: ^1.21

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Create dist folder
        run: mkdir -p dist

      - name: Compile GeoIP conversion bin (Golang)
        run: ./build.sh

      - name: Obtain CN IP lists
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o dist/CN-ip-cidr1.txt \
            "https://metowolf.github.io/iplist/data/country/CN.txt"

          curl -fL --retry 3 --retry-delay 2 \
            -o dist/CN-ip-cidr2.txt \
            "https://raw.githubusercontent.com/DH-Teams/DH-Geo_AS_IP_CN/main/Geo_AS_IP_CN.txt"

      - name: Merge CN IP lists
        run: |
          {
            sed 's/\r$//' dist/CN-ip-cidr1.txt
            printf '\n'
            sed 's/\r$//' dist/CN-ip-cidr2.txt
          } > dist/CN-ip-cidr.txt

      - name: Deduplicate CN IP list
        run: |
          sed -i '/^[[:space:]]*$/d' dist/CN-ip-cidr.txt
          sort -u dist/CN-ip-cidr.txt -o dist/CN-ip-cidr.txt

      - name: Generate GeoIP2 database
        run: |
          cd dist
          ./ipip2mmdb -s ./CN-ip-cidr.txt -d Country.mmdb
          cd ..

      - name: Create CN-ip-cidr-clash.list
        run: |
          sed '/^#/!s/^/IP-CIDR,/' dist/CN-ip-cidr.txt > dist/CN-ip-cidr-clash.list

      - name: Check for changes
        id: changes
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release:release
          else
            git branch release
          fi

          changed=false

          if ! cmp -s dist/Country.mmdb <(git show release:Country.mmdb 2>/dev/null); then
            changed=true
          fi

          if ! cmp -s dist/CN-ip-cidr.txt <(git show release:CN-ip-cidr.txt 2>/dev/null); then
            changed=true
          fi

          if ! cmp -s dist/CN-ip-cidr-clash.list <(git show release:CN-ip-cidr-clash.list 2>/dev/null); then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Push artifacts to release branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "33897984+Masaiki@users.noreply.github.com"
          git config --local user.name "github-action[bot]"

          git checkout release

          cp -f dist/CN-ip-cidr.txt ./
          cp -f dist/Country.mmdb ./
          cp -f dist/CN-ip-cidr-clash.list ./

          git add Country.mmdb
          git add CN-ip-cidr.txt
          git add CN-ip-cidr-clash.list

          git commit -m "Updated at $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          git push origin release
